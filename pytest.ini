[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# The default "green" signal excludes integration tests (they need Docker /
# a live server). CI runs them explicitly with `-m integration`.
addopts = -m "not integration"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: needs ephemeral Postgres/Redis or a live server (SPEC-B01)
