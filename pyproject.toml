[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-ai"
version = "2.0.0"
description = "Algorithmic trading platform with explainable AI signals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "TRADER AI Team", email = "dev@trader-ai.example"}
]
keywords = ["trading", "algorithmic-trading", "ai", "machine-learning", "forex", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = "py.typed"

# TOOLING: Ruff (linter + formatter), Black, MyPy, Bandit, Pre-commit

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "PGH",    # pygrep-hooks
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "T20",    # flake8-print
    "PIE",    # flake8-pie
    "TID",    # flake8-tidy-imports
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM115", # use context handler for opening files
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM", "TID", "RUF"]
"scripts/*" = ["T20", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "app", "tests", "scripts"]

[tool.black]
line-length = 100
indent-size = 4
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.streamlit
  | \.pytest_cache
  | build
  | dist
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "sklearn.*", "lightgbm.*", "shap.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pydantic.*", "pydantic_settings.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.bandit]
target = ["core", "api", "tests"]
exclude = ["tests/", "scripts/"]
skip = ["B413", "B703"]  # B413: blacklist (pycrypto) - uso intencional en auth

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["api", "core"]
omit = [
    "tests/*",
    "*/migrations/*",
    "scripts/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[project.optional-dependencies]
dev = [
    "optuna>=3.0.0",
    "optuna-dashboard>=0.1.0",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pre-commit]
default_stages = ["pre-commit"]
fail_fast = true

[[tool.pre-commit.hooks]]
id = "ruff"
name = "ruff"
description = "Lint and fix Python files"
entry = "ruff"
language = "system"
types_or = ["python"]
args = ["check", "--fix"]

[[tool.pre-commit.hooks]]
id = "black"
name = "black"
description = "Format Python code"
entry = "black"
language = "system"
types_or = ["python"]

[[tool.pre-commit.hooks]]
id = "mypy"
name = "mypy"
description = "Type-check Python files"
entry = "mypy"
language = "system"
types_or = ["python"]
pass_filenames = false
args = ["api/", "core/", "--config-file=pyproject.toml"]

[[tool.pre-commit.hooks]]
id = "bandit"
name = "bandit"
description = "Security linting"
entry = "bandit"
language = "system"
types_or = ["python"]
args = ["-r", "api/", "core/", "-c", "pyproject.toml"]

# PROJECT STRUCTURE - see pyproject.toml.project-structure in docs