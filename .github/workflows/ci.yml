name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + black + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff black bandit

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Bandit security scan
        run: bandit -r api/ core/ -x tests/

  # ── Type check ───────────────────────────────────────────────────────────
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy on core and api
        run: mypy core/ api/ --config-file=pyproject.toml

  # ── Unit tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # Use minimal CI requirements — avoids pandas-ta/shap/hmmlearn compilation issues
        run: pip install -r requirements-ci.txt

      - name: Run unit tests
        env:
          EXECUTION_MODE: paper
          TRADING_ENABLED: "false"
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          BINANCE_API_KEY: ""
          BINANCE_SECRET_KEY: ""
        run: |
          pytest tests/unit/ tests/quant/ -v --tb=short --cov=core --cov-report=xml -m "not slow and not integration"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Integration tests (hermetic: ephemeral Postgres + Redis) ────────────
  integration-tests:
    name: Integration Tests (hermetic)
    runs-on: ubuntu-latest
    needs: [unit-tests, type-check]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trader_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trader" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
          pip install uvicorn httpx

      - name: Run integration + e2e tests
        env:
          EXECUTION_MODE: paper
          TRADING_ENABLED: "false"
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          BINANCE_API_KEY: ""
          BINANCE_SECRET_KEY: ""
          CI_DB_READY: "1"
          DATABASE_URL: postgresql+asyncpg://trader:trader@localhost:5432/trader_ai
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/integration/ tests/test_dashboard_e2e.py -v --tb=short -m integration

  # ── Safety gate ─────────────────────────────────────────────────────────
  safety-checks:
    name: Safety Gate
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v4

      - name: Verify EXECUTION_MODE defaults to paper
        run: |
          grep -q "EXECUTION_MODE=paper" .env.example || (echo "❌ EXECUTION_MODE must default to paper" && exit 1)
          echo "✅ EXECUTION_MODE defaults to paper"

      - name: Verify TRADING_ENABLED defaults to false
        run: |
          grep -q "TRADING_ENABLED=false" .env.example || (echo "❌ TRADING_ENABLED must default to false" && exit 1)
          echo "✅ TRADING_ENABLED defaults to false"

      - name: Check for hardcoded secrets
        run: |
          ! grep -rn --include="*.py" "api_secret\s*=\s*['\"][A-Za-z0-9]" core/ api/ || \
            (echo "❌ Potential hardcoded secret found" && exit 1)
          echo "✅ No hardcoded secrets found"

  # ── I1 gate (optional, requires parquet data in repo) ───────────────────
  i1-gate:
    name: I1 Phase-5 Gate (strict)
    runs-on: ubuntu-latest
    needs: [unit-tests, type-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run I1 gate (strict)
        env:
          EXECUTION_MODE: paper
          TRADING_ENABLED: "false"
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
        run: |
          if ls data/raw/parquet/1h/*_1h.parquet 1>/dev/null 2>&1; then
            python scripts/run_i1_edge_research.py --strict --bootstrap 200
          else
            echo "Skipping I1 strict gate: no parquet data in data/raw/parquet/1h/"
          fi

  # ── Backtest gate ────────────────────────────────────────────────────────
  backtest-gate:
    name: Backtest Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, type-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run backtest gate
        env:
          EXECUTION_MODE: paper
          TRADING_ENABLED: "false"
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
        run: python scripts/ci_backtest_gate.py

  # ── Docker build ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [unit-tests, safety-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t trader-ai:ci .

      - name: Verify container starts
        run: |
          docker run --rm \
            -e EXECUTION_MODE=paper \
            -e TRADING_ENABLED=false \
            -e JWT_SECRET_KEY=ci-test-secret-key-minimum-32-chars-long \
            -e BINANCE_API_KEY="" \
            -e BINANCE_SECRET_KEY="" \
            trader-ai:ci python -c "from core.config.settings import get_settings; s = get_settings(); print('✅ Config OK, mode:', s.EXECUTION_MODE)"
